<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1115">
<title>Salon</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f1115;--card:#171a21;--card2:#1d212a;--text:#f7f7f8;--muted:#9299a7;--accent:#d9a86c;--line:#292e38}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}.app{max-width:720px;margin:auto;min-height:100vh;padding:18px 16px 94px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:22px;font-weight:800}.hello{font-size:13px;color:var(--muted);margin-top:3px}.lang{display:flex;background:var(--card);padding:3px;border-radius:12px}.lang button{background:transparent;color:var(--muted);padding:7px 9px;border-radius:9px}.lang .on{background:var(--card2);color:var(--text)}.hero{padding:24px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#1b1f27,#14171d);margin-bottom:18px}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:29px;line-height:1.05;margin:9px 0}.hero p{color:var(--muted);margin:0;line-height:1.5}.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 11px}.section-title h2{font-size:18px;margin:0}.count{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left}.card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.card b{display:block;font-size:15px}.price{margin-top:9px;color:var(--accent);font-weight:700}.duration{color:var(--muted);font-size:12px;margin-top:5px}.masters{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.master{white-space:nowrap;background:var(--card);border:1px solid var(--line);padding:11px 14px;border-radius:13px}.master.active{border-color:var(--accent);color:var(--accent)}.dates,.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pill{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 5px;text-align:center}.pill.active{background:var(--accent);color:#15120f;border-color:var(--accent);font-weight:700}.field{margin:9px 0}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 3px}.field input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;color:var(--text);outline:none}.field input:focus{border-color:var(--accent)}.primary{width:100%;padding:15px;border-radius:15px;background:var(--accent);color:#17130e;font-weight:800;margin-top:10px}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(15,17,21,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:7px}.nav{flex:1;background:transparent;color:var(--muted);padding:8px 4px;border-radius:12px;font-size:11px}.nav.active{background:var(--card);color:var(--text)}.nav span{display:block;font-size:18px;margin-bottom:2px}.booking{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:10px}.booking-head{display:flex;justify-content:space-between;gap:10px}.actions{display:flex;gap:8px;margin-top:13px}.action{flex:1;padding:11px;border-radius:12px;background:var(--card2);font-weight:700}.action.confirm{background:var(--accent);color:#17130e}.detail{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px}.detail h2{margin:0 0 14px}.contact{display:flex;gap:8px}.contact a{flex:1;text-decoration:none;text-align:center;padding:12px;border-radius:12px;background:var(--card2);color:var(--text);font-weight:700}.status{font-size:11px;padding:5px 8px;border-radius:8px;background:var(--card2);color:var(--accent);white-space:nowrap}.meta{color:var(--muted);font-size:13px;line-height:1.6;margin-top:8px}.empty{padding:34px 18px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:18px}.toast{position:fixed;left:16px;right:16px;bottom:78px;background:#252a34;border:1px solid var(--line);padding:13px 15px;border-radius:14px;text-align:center;display:none;z-index:5}.hidden{display:none!important}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body><div class="app">
<header class="top"><div><div class="brand" id="brand">SALON</div><div class="hello" id="hello"></div></div><div class="lang"><button id="ru" onclick="setLang('ru')">RU</button><button id="uz" onclick="setLang('uz')">UZ</button></div></header>
<section id="home"><div class="hero"><div class="eyebrow">Beauty booking</div><h1 id="heroTitle"></h1><p id="heroText"></p></div>
<div class="section-title"><h2 id="servicesTitle"></h2><span class="count" id="serviceCount"></span></div><div class="grid" id="services"></div>
<div class="section-title"><h2 id="mastersTitle"></h2></div><div class="masters" id="masters"></div>
<div class="section-title"><h2 id="dateTitle"></h2></div><div class="dates" id="dates"></div>
<div class="section-title"><h2 id="timeTitle"></h2></div><div class="times" id="times"></div>
<div class="section-title"><h2 id="contactTitle"></h2></div><div class="field"><label id="nameLabel"></label><input id="name" autocomplete="name"></div><div class="field"><label id="phoneLabel"></label><input id="phone" type="tel" autocomplete="tel" placeholder="+998 90 000 00 00"></div><button class="primary" id="bookBtn" onclick="book()"></button></section>
<section id="records" class="hidden"><div class="hero"><div class="eyebrow">Staff</div><h1 id="recordsTitle"></h1><p id="recordsText"></p></div><div id="bookingDetail" class="hidden"></div><div id="bookings"></div></section>
</div><nav class="bottom"><button class="nav active" id="homeNav" onclick="showTab('home')"><span>⌂</span><label id="homeNavText"></label></button><button class="nav" id="recordsNav" onclick="showTab('records')"><span>▣</span><label id="recordsNavText"></label></button></nav><div class="toast" id="toast"></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();tg.setHeaderColor('#0f1115');tg.setBackgroundColor('#0f1115')}
const state={lang:'ru',me:null,data:null,service:null,master:null,date:null,time:null};
const T={ru:{home:'Главная',records:'Записи',hero:'Запишитесь без звонка',heroText:'Выберите услугу, мастера и удобное время — всё в одном месте.',services:'Услуги',master:'Мастер',date:'Дата',time:'Время',contacts:'Контактные данные',name:'Имя',phone:'Телефон',book:'Записаться',staff:'Все записи салона доступны только разрешённому Telegram-аккаунту.',empty:'Пока нет записей.',success:'Запись создана!',choose:'Сначала выберите услугу, мастера, дату и время.',error:'Не удалось выполнить действие.',today:'Сегодня',days:['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],status:{new:'Новая',confirmed:'Подтверждена',cancelled:'Отменена'}},uz:{home:'Asosiy',records:'Yozuvlar',hero:'Qo‘ng‘iroqsiz yoziling',heroText:'Xizmat, usta va qulay vaqtni tanlang — hammasi bir joyda.',services:'Xizmatlar',master:'Usta',date:'Sana',time:'Vaqt',contacts:'Kontakt ma’lumotlari',name:'Ism',phone:'Telefon',book:'Yozilish',staff:'Salon yozuvlari faqat ruxsat berilgan Telegram akkauntiga ochiq.',empty:'Hozircha yozuvlar yo‘q.',success:'Yozuv yaratildi!',choose:'Avval xizmat, usta, sana va vaqtni tanlang.',error:'Amalni bajarib bo‘lmadi.',today:'Bugun',days:['Ya','Du','Se','Cho','Pa','Ju','Sha'],status:{new:'Yangi',confirmed:'Tasdiqlangan',cancelled:'Bekor qilingan'}}};
function tr(k){return T[state.lang][k]} function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(url,opts={}){opts.headers={...(opts.headers||{}),'X-Telegram-Init-Data':tg?.initData||''};const r=await fetch(url,opts);if(!r.ok)throw new Error(await r.text()||r.statusText);return r.json()}
function setLang(l){state.lang=l;document.getElementById('ru').classList.toggle('on',l==='ru');document.getElementById('uz').classList.toggle('on',l==='uz');renderText();loadCatalog()}
function renderText(){const x=T[state.lang];for(const [id,v] of [['homeNavText',x.home],['recordsNavText',x.records],['heroTitle',x.hero],['heroText',x.heroText],['servicesTitle',x.services],['mastersTitle',x.master],['dateTitle',x.date],['timeTitle',x.time],['contactTitle',x.contacts],['nameLabel',x.name],['phoneLabel',x.phone],['bookBtn',x.book],['recordsTitle',x.records],['recordsText',x.staff]])document.getElementById(id).textContent=v}
async function loadCatalog(){const c=await api('/api/catalog?lang='+state.lang);state.data=c;document.getElementById('brand').textContent=c.salon.name||'SALON';renderCatalog()}
function renderCatalog(){const s=state.data?.services||[];document.getElementById('serviceCount').textContent=s.length+' '+(state.lang==='ru'?'услуг':'xizmat');document.getElementById('services').innerHTML=s.map(x=>'<button class="card '+(state.service?.key===x.key?'active':'')+'" onclick="chooseService(\''+x.key+'\')"><b>'+esc(x.name)+'</b><div class="price">'+esc(x.price)+'</div><div class="duration">'+x.duration+' '+(state.lang==='ru'?'мин':'daq')+'</div></button>').join('');renderMasters();renderDates();renderTimes()}
function chooseService(k){state.service=state.data.services.find(x=>x.key===k);state.master=null;state.time=null;renderCatalog()}
function renderMasters(){const e=document.getElementById('masters');if(!state.service){e.innerHTML='<div class="empty">'+(state.lang==='ru'?'Сначала выберите услугу':'Avval xizmatni tanlang')+'</div>';return}e.innerHTML=state.service.masters.map(m=>'<button class="master '+(state.master?.key===m.key?'active':'')+'" onclick="chooseMaster(\''+m.key+'\')">'+esc(m.name)+'</button>').join('')}
function chooseMaster(k){state.master=state.service.masters.find(x=>x.key===k);state.time=null;renderDates();renderTimes()}
function renderDates(){const e=document.getElementById('dates'),n=new Date();e.innerHTML=Array.from({length:7},(_,i)=>{const d=new Date(n);d.setDate(n.getDate()+i);const v=String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');return '<button class="pill '+(state.date===v?'active':'')+'" onclick="chooseDate(\''+v+'\')">'+(i===0?tr('today'):v+' '+T[state.lang].days[d.getDay()])+'</button>'}).join('')}
function chooseDate(v){state.date=v;state.time=null;renderDates();renderTimes()}
function renderTimes(){const e=document.getElementById('times');if(!state.service||!state.master||!state.date){e.innerHTML='<div class="empty" style="grid-column:1/-1">'+(state.lang==='ru'?'Выберите услугу, мастера и дату':'Xizmat, usta va sanani tanlang')+'</div>';return}const parts=state.date.split('.'),d=new Date(new Date().getFullYear(),Number(parts[1])-1,Number(parts[0])),weekday=(d.getDay()+6)%7,ranges=(state.master.schedule||[]).filter(x=>Number(x.weekday)===weekday);const a=[];for(const r of ranges){let [sh,sm]=r.start.split(':').map(Number),[eh,em]=r.end.split(':').map(Number);let cur=sh*60+sm,end=eh*60+em;const ls=r.lunch_start?[...r.lunch_start.split(':').map(Number)]:null,le=r.lunch_end?[...r.lunch_end.split(':').map(Number)]:null,lunchS=ls?ls[0]*60+ls[1]:null,lunchE=le?le[0]*60+le[1]:null;while(cur<end){const dur=Number(state.service.duration||30);if(cur+dur<=end&&!(lunchS!==null&&lunchE!==null&&cur<lunchE&&cur+dur>lunchS))a.push(String(Math.floor(cur/60)).padStart(2,'0')+':'+String(cur%60).padStart(2,'0'));cur+=30}}e.innerHTML=a.length?a.map(t=>'<button class="pill '+(state.time===t?'active':'')+'" onclick="chooseTime(\''+t+'\')">'+t+'</button>').join(''):'<div class="empty" style="grid-column:1/-1">'+(state.lang==='ru'?'В этот день мастер не работает':'Bu kuni usta ishlamaydi')+'</div>'}
function chooseTime(v){state.time=v;renderTimes()}
async function book(){if(!state.service||!state.master||!state.date||!state.time){toast(tr('choose'));return}const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim();if(!name||!phone){toast(state.lang==='ru'?'Заполните имя и телефон':'Ism va telefonni kiriting');return}try{await api('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_key:state.service.key,master_key:state.master.key,date:state.date,time:state.time,name,phone,lang:state.lang})});toast(tr('success'));state.time=null;renderTimes();tg?.HapticFeedback?.notificationOccurred('success')}catch(e){toast(e.message.includes('already')?'Это время уже занято.':tr('error'))}}
async function loadRecords(){const e=document.getElementById('bookings');try{const r=await api('/api/admin/bookings');e.innerHTML=r.bookings.length?r.bookings.map(b=>'<article class="booking" onclick="openBooking('+b.id+')"><div class="booking-head"><b>#'+b.id+' · '+esc(b.service)+'</b><span class="status">'+esc(T[state.lang].status[b.status]||b.status)+'</span></div><div class="meta">👩‍🎨 '+esc(b.master)+'<br>📅 '+esc(b.date)+' · '+esc(b.time)+'<br>👤 '+esc(b.name)+'</div></article>').join(''):'<div class="empty">'+tr('empty')+'</div>'}catch(e){e.innerHTML='<div class="empty">'+tr('error')+'</div>'}}
async function openBooking(id){try{const r=await api('/api/admin/bookings/'+id),b=r.booking;const d=document.getElementById('bookingDetail');const phone=String(b.phone||'').replace(/[^+\\d]/g,'');d.classList.remove('hidden');d.innerHTML='<button class="master" onclick="closeBooking()">← '+tr('records')+'</button><div class="detail"><div class="booking-head"><h2>#'+b.id+'</h2><span class="status">'+esc(T[state.lang].status[b.status]||b.status)+'</span></div><div class="meta">💇 '+esc(b.service)+'<br>👩‍🎨 '+esc(b.master)+'<br>📅 '+esc(b.date)+' · '+esc(b.time)+'<br>👤 '+esc(b.name)+'<br>📞 '+esc(b.phone)+(b.username?'<br>Telegram: @'+esc(b.username):'')+'</div><div class="contact"><a href="tel:'+phone+'">📞 Позвонить</a><a href="https://t.me/'+esc(b.username||'')+'" target="_blank">💬 Написать</a></div><div class="actions">'+(b.status!=='confirmed'?'<button class="action confirm" onclick="setBookingStatus('+b.id+',\'confirmed\')">✓ Подтвердить</button>':'')+(b.status!=='cancelled'?'<button class="action" onclick="setBookingStatus('+b.id+',\'cancelled\')">Отменить</button>':'')+'</div></div>';document.getElementById('bookings').classList.add('hidden')}catch(e){toast(tr('error'))}}
function closeBooking(){document.getElementById('bookingDetail').classList.add('hidden');document.getElementById('bookings').classList.remove('hidden')}
async function setBookingStatus(id,status){try{await api('/api/admin/bookings/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});toast(status==='confirmed'?'Запись подтверждена!':'Запись отменена');closeBooking();loadRecords()}catch(e){toast(tr('error'))}}
function showTab(t){document.getElementById('home').classList.toggle('hidden',t!=='home');document.getElementById('records').classList.toggle('hidden',t!=='records');document.getElementById('homeNav').classList.toggle('active',t==='home');document.getElementById('recordsNav').classList.toggle('active',t==='records');if(t==='records')loadRecords()}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',3000)}
async function init(){try{state.me=await api('/api/me');document.getElementById('hello').textContent=state.me.user.first_name||'';if(!state.me.is_admin)document.getElementById('recordsNav').classList.add('hidden');document.getElementById('name').value=state.me.user.first_name||'';renderText();await loadCatalog()}catch(e){document.body.innerHTML='<div class="app"><div class="empty" style="margin-top:30vh">Откройте приложение из Telegram.</div></div>'}}init();
</script></body></html>
