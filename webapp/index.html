<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101216">
<title>Salon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#101216;--card:#181b21;--card2:#20242c;--text:#f7f7f8;--muted:#9299a7;--accent:#d9a86c;--line:#2a2f38;--danger:#d86b6b;--ok:#70c38b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}button,input,select{font:inherit}button{border:0;color:inherit;cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding:16px 15px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{font-size:21px;font-weight:800}.hello{font-size:13px;color:var(--muted);margin-top:3px}.lang{display:flex;background:var(--card);padding:3px;border-radius:12px}.lang button{background:transparent;color:var(--muted);padding:7px 9px;border-radius:9px}.lang .on{background:var(--card2);color:var(--text)}.hero{padding:21px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#1d2129,#15181e);margin-bottom:15px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:27px;line-height:1.08;margin:8px 0}.hero p{color:var(--muted);margin:0;line-height:1.5}.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.section-title h2{font-size:17px;margin:0}.count{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card,.booking,.detail,.staff-card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px}.card{text-align:left}.card.active,.pill.active,.master.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.card b{display:block;font-size:14px}.price{margin-top:8px;color:var(--accent);font-weight:800}.duration,.meta,.hint{color:var(--muted);font-size:12px;line-height:1.55}.duration{margin-top:4px}.masters{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.master{white-space:nowrap;background:var(--card);border:1px solid var(--line);padding:10px 13px;border-radius:12px}.master.active{color:var(--accent)}.dates,.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pill{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 4px;text-align:center}.pill.active{background:var(--accent);color:#17130e}.field{margin:9px 0}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 3px}.field input,.field select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);outline:none}.primary{width:100%;padding:14px;border-radius:14px;background:var(--accent);color:#17130e;font-weight:800;margin-top:9px}.secondary{width:100%;padding:12px;border-radius:12px;background:var(--card2);font-weight:700}.danger{background:rgba(216,107,107,.14);color:#ffaaa8}.ok{color:var(--ok)}.bottom{position:fixed;z-index:10;left:0;right:0;bottom:0;background:rgba(16,18,22,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px}.nav{flex:1;background:transparent;color:var(--muted);padding:7px 3px;border-radius:11px;font-size:10px}.nav.active{background:var(--card);color:var(--text)}.nav span{display:block;font-size:18px;margin-bottom:2px}.booking{margin-bottom:9px}.booking-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.status{font-size:10px;padding:5px 7px;border-radius:8px;background:var(--card2);color:var(--accent);white-space:nowrap}.actions{display:flex;gap:7px;margin-top:11px}.action{flex:1;padding:10px;border-radius:11px;background:var(--card2);font-weight:700;font-size:12px}.action.confirm{background:var(--accent);color:#17130e}.contact{display:flex;gap:7px;margin-top:12px}.contact a{flex:1;text-decoration:none;text-align:center;padding:11px;border-radius:11px;background:var(--card2);color:var(--text);font-weight:700;font-size:12px}.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:16px}.hidden{display:none!important}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.toolbar .wide{grid-column:1/-1}.toolbar button,.toolbar select,.toolbar input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:10px}.chips{display:flex;gap:7px;overflow:auto;padding:2px 0 7px}.chip{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-size:12px}.chip.active{border-color:var(--accent);color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px}.stat b{display:block;font-size:19px}.stat span{font-size:10px;color:var(--muted)}.admin-section{margin-top:16px}.list-row{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:7px}.list-row .grow{min-width:0}.small-btn{padding:8px 9px;border-radius:9px;background:var(--card2);font-size:11px}.schedule-row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}.schedule-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-top:8px}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand" id="brand">SALON</div><div class="hello" id="hello"></div></div><div class="lang"><button id="ru" onclick="setLang('ru')">RU</button><button id="uz" onclick="setLang('uz')">UZ</button></div></header>

<section id="clientHome">
<div class="hero"><div class="eyebrow">Beauty booking</div><h1 id="heroTitle"></h1><p id="heroText"></p></div>
<div class="section-title"><h2 id="servicesTitle"></h2><span class="count" id="serviceCount"></span></div><div class="grid" id="services"></div>
<div class="section-title"><h2 id="mastersTitle"></h2></div><div class="masters" id="masters"></div>
<div class="section-title"><h2 id="dateTitle"></h2></div><div class="dates" id="dates"></div>
<div class="section-title"><h2 id="timeTitle"></h2></div><div class="times" id="times"></div>
<div class="section-title"><h2 id="contactTitle"></h2></div>
<div class="field"><label id="nameLabel"></label><input id="name" autocomplete="name"></div>
<div class="field"><label id="phoneLabel"></label><input id="phone" type="tel" autocomplete="tel" placeholder="+998 90 000 00 00"></div>
<button class="primary" id="bookBtn" onclick="book()"></button>
</section>

<section id="clientRecords" class="hidden"><div class="hero"><div class="eyebrow">Salon</div><h1 id="recordsTitle"></h1><p id="recordsText"></p></div><div id="clientBookings"></div></section>

<section id="staffHome" class="hidden">
<div class="hero"><div class="eyebrow" id="staffEyebrow">Management</div><h1 id="staffTitle"></h1><p id="staffText"></p></div>
<div id="staffSummary"></div>
</section>

<section id="adminPanel" class="hidden">
<div class="hero"><div class="eyebrow">Management</div><h1 id="adminTitle"></h1><p id="adminText"></p></div>
<div class="section-title"><h2 id="calendarTitle"></h2></div><div class="dates" id="adminCalendar"></div>
<div class="section-title"><h2 id="filterTitle"></h2></div>
<div class="chips" id="quickFilters"></div>
<div class="toolbar">
<input id="adminSearch" class="wide" placeholder="Имя, телефон или Telegram" oninput="clearTimeout(window._searchTimer);window._searchTimer=setTimeout(loadAdminBookings,300)">
<select id="adminMasterFilter" onchange="loadAdminBookings()"><option value="">Все мастера</option></select>
<select id="adminStatusFilter" onchange="loadAdminBookings()"><option value="">Все статусы</option></select>
<input id="adminDateFrom" type="date" onchange="loadAdminBookings()">
<input id="adminDateTo" type="date" onchange="loadAdminBookings()">
</div>
<div class="stats" id="adminStats"></div>
<div id="adminBookings"></div>
<div class="admin-section"><div class="section-title"><h2>Мастера</h2></div><div id="adminMasters"></div><button class="primary" onclick="addMasterUI()">＋ Добавить мастера</button></div>
<div class="admin-section"><div class="section-title"><h2>Услуги</h2></div><div id="adminServices"></div><button class="primary" onclick="addServiceUI()">＋ Добавить услугу</button></div>
<div class="admin-section"><div class="section-title"><h2>Расписание и обед</h2></div><div id="adminSchedules"></div></div>
</section>

<section id="masterPanel" class="hidden">
<div class="hero"><div class="eyebrow">My schedule</div><h1 id="masterTitle"></h1><p id="masterText"></p></div>
<div class="chips" id="masterQuick"></div><div id="masterBookings"></div>
</section>
</div>

<nav class="bottom">
<button class="nav active" id="homeNav" onclick="showTab('home')"><span>⌂</span><label id="homeNavText"></label></button>
<button class="nav hidden" id="recordsNav" onclick="showTab('records')"><span>▣</span><label id="recordsNavText"></label></button>
<button class="nav hidden" id="masterNav" onclick="showTab('master')"><span>👩‍🎨</span><label id="masterNavText"></label></button>
<button class="nav hidden" id="adminNav" onclick="showTab('admin')"><span>⚙</span><label id="adminNavText"></label></button>
</nav>
<div class="toast" id="toast"></div>

<script>
function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("show");clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.remove("show"),2500)}
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();tg.setHeaderColor('#101216');tg.setBackgroundColor('#101216');}
const state={lang:(tg?.initDataUnsafe?.user?.language_code==='uz'?'uz':'ru'),me:null,data:null,service:null,master:null,date:null,time:null,adminDate:'',quick:'',masterQuick:''};
const T={
ru:{home:'Главная',records:'Мои записи',master:'Мои записи',admin:'Управление',hero:'Запишитесь без звонка',heroText:'Выберите услугу, мастера и удобное время — всё в одном месте.',services:'Услуги',masterLabel:'Мастер',date:'Дата',time:'Время',contacts:'Контактные данные',name:'Имя',phone:'Телефон',book:'Записаться',empty:'Пока нет записей.',success:'Запись создана!',choose:'Сначала выберите услугу, мастера, дату и время.',error:'Не удалось выполнить действие.',today:'Сегодня',tomorrow:'Завтра',period:'Период',all:'Все',days:['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],status:{new:'Новая',confirmed:'Подтверждена',cancelled:'Отменена',completed:'Выполнена',no_show:'Не пришёл',in_progress:'В работе'},confirm:'Подтвердить',cancel:'Отменить',reschedule:'Перенести',done:'Услуга выполнена',noshow:'Клиент не пришёл',comment:'Комментарий',call:'Позвонить',write:'Написать',cancelQuestion:'Отменить запись?',moveAdmin:'Перенести через администратора'},
uz:{home:'Asosiy',records:'Mening yozuvlarim',master:'Mening yozuvlarim',admin:'Boshqaruv',hero:'Qo‘ng‘iroqsiz yoziling',heroText:'Xizmat, usta va qulay vaqtni tanlang — hammasi bir joyda.',services:'Xizmatlar',masterLabel:'Usta',date:'Sana',time:'Vaqt',contacts:'Kontakt ma’lumotlari',name:'Ism',phone:'Telefon',book:'Yozilish',empty:'Hozircha yozuvlar yo‘q.',success:'Yozuv yaratildi!',choose:'Avval xizmat, usta, sana va vaqtni tanlang.',error:'Amalni bajarib bo‘lmadi.',today:'Bugun',tomorrow:'Ertaga',period:'Davr',all:'Barchasi',days:['Ya','Du','Se','Cho','Pa','Ju','Sha'],status:{new:'Yangi',confirmed:'Tasdiqlangan',cancelled:'Bekor qilingan',completed:'Bajarildi',no_show:'Mijoz kelmadi',in_progress:'Jarayonda'},confirm:'Tasdiqlash',cancel:'Bekor qilish',reschedule:'Ko‘chirish',done:'Xizmat bajarildi',noshow:'Mijoz kelmadi',comment:'Izoh',call:'Qo‘ng‘iroq',write:'Yozish',cancelQuestion:'Yozuvni bekor qilasizmi?',moveAdmin:'Administrator orqali ko‘chirish'}
};
function tr(k){return T[state.lang][k]||k}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(url,opts={}){opts.headers={...(opts.headers||{}),'X-Telegram-Init-Data':tg?.initData||''};const r=await fetch(url,opts);if(!r.ok){let x=await r.text();throw new Error(x||r.statusText)}return r.json()}
async function setLang(l){state.lang=l;document.getElementById('ru').classList.toggle('on',l==='ru');document.getElementById('uz').classList.toggle('on',l==='uz');renderText();await loadCatalog();if(state.me?.is_admin){await loadAdminCatalog();await loadAdminSchedules()}}
function renderText(){const x=T[state.lang];const map={homeNavText:x.home,recordsNavText:x.records,masterNavText:x.master,adminNavText:x.admin,heroTitle:x.hero,heroText:x.heroText,servicesTitle:x.services,mastersTitle:x.masterLabel,dateTitle:x.date,timeTitle:x.time,contactTitle:x.contacts,nameLabel:x.name,phoneLabel:x.phone,bookBtn:x.book,recordsTitle:x.records,recordsText:state.lang==='ru'?'Здесь ваши записи и их статусы.':'Bu yerda yozuvlaringiz va holatlari.'};Object.keys(map).forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=map[id]});document.getElementById('adminTitle').textContent=state.lang==='ru'?'Панель бизнеса':'Boshqaruv paneli';document.getElementById('adminText').textContent=state.lang==='ru'?'Записи, календарь, мастера, услуги и расписание.':'Yozuvlar, taqvim, ustalar, xizmatlar va jadval.';document.getElementById('masterTitle').textContent=x.master;document.getElementById('masterText').textContent=state.lang==='ru'?'Только ваши записи. Подтверждать и переносить нельзя.':'Faqat sizning yozuvlaringiz. Tasdiqlash va ko‘chirish mumkin emas.';document.getElementById('calendarTitle').textContent=state.lang==='ru'?'Календарь':'Taqvim';document.getElementById('filterTitle').textContent=state.lang==='ru'?'Фильтры':'Filtrlar')}
async function loadCatalog(){try{state.data=await api('/api/catalog?lang='+state.lang);document.getElementById('brand').textContent=state.data.salon?.name||'SALON';if(!state.me?.is_admin&&!state.me?.is_master)renderClient()}catch(e){toast(tr('error'))}}
function renderClient(){const s=state.data?.services||[];document.getElementById('serviceCount').textContent=s.length+' '+(state.lang==='ru'?'услуг':'xizmat');document.getElementById('services').innerHTML=s.map(x=>'<button class="card '+(state.service?.key===x.key?'active':'')+'" data-service="'+esc(x.key)+'"><b>'+esc(x.name)+'</b><div class="price">'+esc(x.price)+'</div><div class="duration">'+x.duration+' '+(state.lang==='ru'?'мин':'daq')+'</div></button>').join('');const me=state.service?.masters||[];document.getElementById('masters').innerHTML=state.service?me.map(m=>'<button class="master '+(state.master?.key===m.key?'active':'')+'" data-master="'+esc(m.key)+'">'+esc(m.name)+'</button>').join(''):'<div class="empty">Выберите услугу</div>';renderDates();renderTimes()}
function chooseService(k){state.service=state.data.services.find(x=>x.key===k);state.master=null;state.date=null;state.time=null;renderClient()}
function chooseMaster(k){state.master=state.service.masters.find(x=>x.key===k);state.date=null;state.time=null;renderDates();renderTimes()}
function localDateFromValue(v){const p=v.split('.'),n=new Date(),m=Number(p[1])-1,d=Number(p[0]);let y=n.getFullYear();if(m<n.getMonth()&&n.getMonth()-m>=6)y++;return new Date(y,m,d)}
function renderDates(){const e=document.getElementById('dates'),n=new Date();e.innerHTML=Array.from({length:7},(_,i)=>{const d=new Date(n);d.setHours(12,0,0,0);d.setDate(n.getDate()+i);const v=String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');return '<button class="pill '+(state.date===v?'active':'')+'" onclick="chooseDate(\''+v+'\')">'+(i===0?tr('today'):v+' '+T[state.lang].days[d.getDay()])+'</button>'}).join('')}
function chooseDate(v){state.date=v;state.time=null;renderDates();renderTimes()}
async function renderTimes(){const e=document.getElementById('times');if(!state.service||!state.master||!state.date){e.innerHTML='<div class="empty" style="grid-column:1/-1">'+tr('choose')+'</div>';return}try{const r=await api('/api/slots?service_key='+encodeURIComponent(state.service.key)+'&master_key='+encodeURIComponent(state.master.key)+'&date='+encodeURIComponent(state.date));const slots=r.slots||[];e.innerHTML=slots.length?slots.map(t=>'<button class="pill '+(state.time===t?'active':'')+'" data-time="'+t+'">'+t+'</button>').join(''):'<div class="empty" style="grid-column:1/-1">'+(state.lang==='ru'?'В этот день нет доступных слотов':'Bu kuni bo‘sh vaqt yo‘q')+'</div>'}catch(err){e.innerHTML='<div class="empty" style="grid-column:1/-1">'+tr('error')+'</div>'}}
function chooseTime(v){state.time=v;renderTimes()}
async function book(){if(!state.service||!state.master||!state.date||!state.time){toast(tr('choose'));return}const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim();if(!name||!phone){toast(state.lang==='ru'?'Заполните имя и телефон':'Ism va telefonni kiriting');return}const btn=document.getElementById('bookBtn');btn.disabled=true;try{await api('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_key:state.service.key,master_key:state.master.key,date:state.date,time:state.time,name,phone,lang:state.lang})});toast(tr('success'));state.time=null;renderTimes();tg?.HapticFeedback?.notificationOccurred('success');showTab('records')}catch(e){toast(e.message.includes('already')?state.lang==='ru'?'Это время уже занято.':'Bu vaqt band.':tr('error'))}finally{btn.disabled=false}}
async function loadMyBookings(){const e=document.getElementById('clientBookings');try{const r=await api('/api/my-bookings');const list=r.bookings||[];e.innerHTML=list.length?list.map(b=>'<article class="booking"><div class="booking-head"><b>'+esc(b.service)+'</b><span class="status">'+esc(T[state.lang].status[b.status]||b.status)+'</span></div><div class="meta">👩‍🎨 '+esc(b.master)+'<br>📅 '+esc(b.date)+' · '+esc(b.time)+'</div>'+(b.status!=='cancelled'&&b.status!=='completed'&&b.status!=='no_show'?'<div class="actions"><button class="action danger" onclick="cancelMyBooking(event,'+b.id+')">'+tr('cancel')+'</button><button class="action" onclick="contactAdmin(event)">'+tr('moveAdmin')+'</button></div>':'')+'</article>').join(''):'<div class="empty">'+tr('empty')+'</div>'}catch(e){e.innerHTML='<div class="empty">'+tr('error')+'</div>'}}
async function cancelMyBooking(ev,id){ev.stopPropagation();if(!confirm(tr('cancelQuestion')))return;try{await api('/api/my-bookings/'+id+'/cancel',{method:'POST'});loadMyBookings();toast(state.lang==='ru'?'Запись отменена':'Yozuv bekor qilindi')}catch(e){toast(tr('error'))}}
function contactAdmin(ev){ev.stopPropagation();const u=state.data?.salon?.telegram;if(u){const h=String(u).replace(/^@/,"");if(h)tg?.openTelegramLink?.("https://t.me/"+h);else toast(tr("error"))}else toast(state.lang==='ru'?'Свяжитесь с администратором в Telegram':'Telegram orqali administrator bilan bog‘laning')}
async function openBooking(id,mode){try{const r=await api('/api/bookings/'+id),b=r.booking,isAdmin=!!state.me?.is_admin,isMaster=!!state.me?.is_master;const d=document.createElement('div');d.className='detail';const phone=String(b.phone||'').replace(/[^+\d]/g,''),tgUrl=b.username?'https://t.me/'+encodeURIComponent(b.username):'';let actions='';if(isAdmin){if(b.status==='new')actions+='<button class="action confirm" onclick="setBookingStatus('+b.id+',\'confirmed\')">'+tr('confirm')+'</button>';if(b.status!=='cancelled')actions+='<button class="action danger" onclick="setBookingStatus('+b.id+',\'cancelled\')">'+tr('cancel')+'</button><button class="action" onclick="rescheduleBooking('+b.id+')">'+tr('reschedule')+'</button>';if(b.status==='confirmed')actions+='<button class="action" onclick="setBookingStatus('+b.id+',\'in_progress\')">'+T[state.lang].status.in_progress+'</button>';if(b.status!=='cancelled'&&b.status!=='new')actions+='<button class="action" onclick="setBookingStatus('+b.id+',\'completed\')">'+tr('done')+'</button><button class="action" onclick="setBookingStatus('+b.id+',\'no_show\')">'+tr('noshow')+'</button>'}else if(isMaster){actions='<button class="action confirm" onclick="setMasterResult('+b.id+',\'completed\')">'+tr('done')+'</button><button class="action" onclick="setMasterResult('+b.id+',\'no_show\')">'+tr('noshow')+'</button><button class="action" onclick="addMasterComment('+b.id+')">📝 '+tr('comment')+'</button>'}d.innerHTML='<button class="secondary" onclick="closeDetail()">← '+(isMaster?tr('master'):isAdmin?tr('admin'):tr('records'))+'</button><div class="section-title"><h2>#'+b.id+' · '+esc(b.service)+'</h2><span class="status">'+esc(T[state.lang].status[b.status]||b.status)+'</span></div><div class="meta">👩‍🎨 '+esc(b.master)+'<br>📅 '+esc(b.date)+' · '+esc(b.time)+'<br>👤 '+esc(b.name)+'<br>📞 '+esc(b.phone)+(b.username?'<br>Telegram: @'+esc(b.username):'')+(b.master_comment?'<br>📝 '+esc(b.master_comment):'')+'</div><div class="contact"><a href="tel:'+phone+'">📞 '+tr('call')+'</a>'+(tgUrl?'<a href="'+tgUrl+'" target="_blank">💬 '+tr('write')+'</a>':'')+'</div><div class="actions">'+actions+'</div>';const target=isAdmin?document.getElementById('adminBookings'):document.getElementById('masterBookings');target.classList.add('hidden');target.parentElement.insertBefore(d,target);d.id='activeDetail';window.scrollTo({top:0,behavior:'smooth'})}catch(e){toast(tr('error'))}}
function closeDetail(){const d=document.getElementById('activeDetail');if(d)d.remove();document.getElementById('adminBookings')?.classList.remove('hidden');document.getElementById('masterBookings')?.classList.remove('hidden')}
async function setBookingStatus(id,status){try{await api('/api/admin/bookings/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});toast(state.lang==='ru'?'Статус сохранён':'Holat saqlandi');closeDetail();loadAdminBookings()}catch(e){toast(tr('error'))}}
async function setMasterResult(id,status,comment){try{await api('/api/admin/bookings/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,comment:comment||''})});toast(state.lang==='ru'?'Статус сохранён':'Holat saqlandi');closeDetail();loadMasterBookings()}catch(e){toast(tr('error'))}}
async function addMasterComment(id){const c=prompt(state.lang==='ru'?'Комментарий к записи:':'Yozuvga izoh:');if(c!==null)await setMasterResult(id,'completed',c)}
async function rescheduleBooking(id){const r=state.data?.masters||[];const date=prompt(state.lang==='ru'?'Новая дата (ДД.ММ):':'Yangi sana (KK.OO):');if(!date)return;const time=prompt(state.lang==='ru'?'Новое время (ЧЧ:ММ):':'Yangi vaqt (SS:DD):');if(!time)return;const masterName=prompt((state.lang==='ru'?'Введите ключ мастера: ':'Usta kalitini kiriting: ')+(r.map(x=>x.key).join(', ')));if(!masterName)return;try{await api('/api/admin/bookings/reschedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({booking_id:id,date,time,master_key:masterName})});toast(state.lang==='ru'?'Запись перенесена':'Yozuv ko‘chirildi');closeDetail();loadAdminBookings()}catch(e){toast(tr('error'))}}
function showTab(t){document.getElementById('clientHome').classList.toggle('hidden',t!=='home'||!!state.me?.is_admin||!!state.me?.is_master);document.getElementById('staffHome').classList.toggle('hidden',t!=='home'||(!state.me?.is_admin&&!state.me?.is_master));document.getElementById('clientRecords').classList.toggle('hidden',t!=='records'||!!state.me?.is_admin||!!state.me?.is_master);document.getElementById('adminPanel').classList.toggle('hidden',t!=='admin'||!state.me?.is_admin);document.getElementById('masterPanel').classList.toggle('hidden',t!=='master'||!state.me?.is_master);document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));const nav=t==='admin'?'adminNav':t==='master'?'masterNav':t==='records'?'recordsNav':'homeNav';document.getElementById(nav)?.classList.add('active');if(t==='records')loadMyBookings();if(t==='admin'){renderAdminCalendar();renderAdminFilters();loadAdminBookings();loadAdminCatalog();loadAdminSchedules()}if(t==='master')loadMasterBookings();if(t==='home'&&state.me?.is_master)loadMasterSummary();if(t==='home'&&state.me?.is_admin)loadAdminSummary()}
function renderAdminCalendar(){const e=document.getElementById('adminCalendar'),n=new Date();e.innerHTML=Array.from({length:14},(_,i)=>{const d=new Date(n);d.setHours(12,0,0,0);d.setDate(n.getDate()+i);const v=String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');return '<button class="pill '+(state.adminDate===v?'active':'')+'" onclick="setAdminDate(\''+v+'\')">'+(i===0?tr('today'):v+' '+T[state.lang].days[d.getDay()])+'</button>'}).join('')}
function setAdminDate(v){state.adminDate=v;state.quick='';document.getElementById('adminDateFrom').value=dateISO(v);document.getElementById('adminDateTo').value=dateISO(v);renderAdminCalendar();loadAdminBookings()}
function renderAdminFilters(){const e=document.getElementById('quickFilters');e.innerHTML='<button class="chip '+(state.quick==='today'?'active':'')+'" onclick="quickFilter(\'today\')">'+tr('today')+'</button><button class="chip '+(state.quick==='tomorrow'?'active':'')+'" onclick="quickFilter(\'tomorrow\')">'+tr('tomorrow')+'</button><button class="chip '+(state.quick==='period'?'active':'')+'" onclick="quickFilter(\'period\')">'+tr('period')+'</button><button class="chip '+(!state.quick?'active':'')+'" onclick="quickFilter(\'all\')">'+tr('all')+'</button>';const s=document.getElementById('adminStatusFilter');s.innerHTML='<option value="">'+tr('all')+'</option>'+Object.keys(T[state.lang].status).map(k=>'<option value="'+k+'">'+T[state.lang].status[k]+'</option>').join('')}
function quickFilter(q){state.quick=q==='all'?'':q;const n=new Date();if(q==='period'){state.adminDate='';document.getElementById('adminDateFrom').focus();renderAdminFilters();loadAdminBookings();return}if(q==='today'||q==='tomorrow'){const d=new Date(n);if(q==='tomorrow')d.setDate(d.getDate()+1);const v=String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');state.adminDate=v;const iso=dateISO(v);document.getElementById('adminDateFrom').value=iso;document.getElementById('adminDateTo').value=iso}else if(q==='all'){state.adminDate='';document.getElementById('adminDateFrom').value='';document.getElementById('adminDateTo').value=''}renderAdminFilters();loadAdminBookings()}
async function loadAdminBookings(){try{const r=await api('/api/admin/bookings/filter?'+new URLSearchParams({date:'',date_from:document.getElementById('adminDateFrom')?.value||'',date_to:document.getElementById('adminDateTo')?.value||'',master:document.getElementById('adminMasterFilter')?.value||'',status:document.getElementById('adminStatusFilter')?.value||'',q:document.getElementById('adminSearch')?.value||''})),all=r.bookings||[],q=(document.getElementById('adminSearch')?.value||'').toLowerCase(),mf=document.getElementById('adminMasterFilter')?.value||'',sf=document.getElementById('adminStatusFilter')?.value||'',from=document.getElementById('adminDateFrom')?.value||'',to=document.getElementById('adminDateTo')?.value||'';const list=all.filter(b=>(!q||(String(b.name)+' '+String(b.phone)+' '+String(b.username||'')).toLowerCase().includes(q))&&(!mf||b.master===mf)&&(!sf||b.status===sf)&&(!from||dateISO(b.date)>=from)&&(!to||dateISO(b.date)<=to));const sel=document.getElementById('adminMasterFilter'),existing=[...sel.options].map(x=>x.value);[...new Set(all.map(b=>b.master).filter(Boolean))].forEach(m=>{if(!existing.includes(m))sel.insertAdjacentHTML('beforeend','<option value="'+esc(m)+'">'+esc(m)+'</option>')});const c={};all.forEach(b=>c[b.status]=(c[b.status]||0)+1);document.getElementById('adminStats').innerHTML='<div class="stat"><b>'+((c.new||0))+'</b><span>Новые</span></div><div class="stat"><b>'+((c.confirmed||0))+'</b><span>Подтверждены</span></div><div class="stat"><b>'+((c.in_progress||0)+(c.completed||0))+'</b><span>В работе / готово</span></div>';document.getElementById('adminBookings').innerHTML=list.length?list.map(b=>'<article class="booking" onclick="openBooking('+b.id+')"><div class="booking-head"><b>#'+b.id+' · '+esc(b.service)+'</b><span class="status">'+esc(T[state.lang].status[b.status]||b.status)+'</span></div><div class="meta">📅 '+esc(b.date)+' · '+esc(b.time)+'<br>👩‍🎨 '+esc(b.master)+'<br>👤 '+esc(b.name)+' · '+esc(b.phone)+'</div></article>').join(''):'<div class="empty">'+tr('empty')+'</div>'}catch(e){toast(tr('error'))}}
function dateISO(v){const p=String(v).split('.');if(p.length!==2)return v;const n=new Date(),m=Number(p[1]),d=Number(p[0]);let y=n.getFullYear();if(m<n.getMonth()+1-6)y++;const x=new Date(y,m-1,d);return String(x.getFullYear()).padStart(4,'0')+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
async function loadAdminCatalog(){try{const r=await api('/api/admin/catalog');document.getElementById('adminMasters').innerHTML=(r.masters||[]).filter(m=>m.active).map(m=>'<div class="list-row"><div class="grow"><b>'+esc(m.name_ru)+'</b><div class="hint">'+esc(m.key)+(m.telegram_id?' · Telegram ✓':'')+'</div></div><button class="small-btn" onclick="setMasterTelegram(\''+esc(m.key)+'\')">Telegram</button><button class="small-btn" onclick="manageMasterServices(\''+esc(m.key)+'\')">Услуги</button><button class="small-btn danger" onclick="deleteMaster(\''+esc(m.key)+'\')">Скрыть</button></div>').join('');document.getElementById('adminServices').innerHTML=(r.services||[]).filter(s=>s.active).map(s=>'<div class="list-row"><div class="grow"><b>'+esc(s.name_ru)+'</b><div class="hint">'+esc(s.price)+' · '+s.duration+' мин</div></div><button class="small-btn" onclick="editServiceUI(\''+esc(s.key)+'\')">Изменить</button><button class="small-btn danger" onclick="deleteService(\''+esc(s.key)+'\')">Скрыть</button></div>').join('')}catch(e){toast(tr('error'))}}
async function addMasterUI(){const key=prompt('Ключ мастера');if(!key)return;const ru=prompt('Имя мастера RU');if(!ru)return;const uz=prompt('Имя мастера UZ')||ru;try{await api('/api/admin/masters',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,name_ru:ru,name_uz:uz})});loadAdminCatalog();loadAdminSchedules()}catch(e){toast(tr('error'))}}
async function setMasterTelegram(k){const id=prompt('Telegram ID мастера. Пусто — отключить');if(id===null)return;try{await api('/api/admin/master-telegram',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({master_key:k,telegram_id:id.trim()})});loadAdminCatalog()}catch(e){toast(tr('error'))}}
async function deleteMaster(k){if(!confirm('Скрыть мастера?'))return;try{await api('/api/admin/masters/'+encodeURIComponent(k),{method:'DELETE'});loadAdminCatalog()}catch(e){toast(tr('error'))}}
async function addServiceUI(){const key=prompt('Ключ услуги');if(!key)return;const ru=prompt('Название RU');if(!ru)return;const uz=prompt('Название UZ')||ru;const price=prompt('Цена');if(!price)return;const duration=Number(prompt('Длительность минут','30'));if(!duration||duration<5)return;try{await api('/api/admin/services',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,name_ru:ru,name_uz:uz,price,duration})});loadAdminCatalog()}catch(e){toast(tr('error'))}}
async function editServiceUI(k){const r=await api('/api/admin/catalog');const s=(r.services||[]).find(x=>x.key===k);if(!s)return;const ru=prompt('Название RU',s.name_ru);if(ru===null)return;const uz=prompt('Название UZ',s.name_uz);if(uz===null)return;const price=prompt('Цена',s.price);if(price===null)return;const duration=Number(prompt('Длительность минут',s.duration));if(!duration)return;try{await api('/api/admin/services/'+encodeURIComponent(k),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k,name_ru:ru,name_uz:uz,price,duration})});loadAdminCatalog()}catch(e){toast(tr('error'))}}
async function deleteService(k){if(!confirm('Скрыть услугу?'))return;try{await api('/api/admin/services/'+encodeURIComponent(k),{method:'DELETE'});loadAdminCatalog()}catch(e){toast(tr('error'))}}
async function manageMasterServices(k){const r=await api('/api/admin/catalog'),m=(r.masters||[]).find(x=>x.key===k),assigned=new Set((r.links||[]).filter(x=>x.master_key===k).map(x=>x.service_key));if(!m)return;const options=(r.services||[]).filter(s=>s.active).map(s=>({s,on:assigned.has(s.key)}));for(const x of options){const on=confirm((x.on?'☑ ':'☐ ')+x.s.name_ru+' — '+(x.on?'убрать?':'назначить?'));if(on!==x.on)await api('/api/admin/service-masters',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_key:x.s.key,master_key:k,enabled:on})})}toast('Сохранено');loadAdminCatalog()}
async function loadAdminSchedules(){try{const r=await api('/api/admin/schedules');const days=state.lang==='ru'?['Пн','Вт','Ср','Чт','Пт','Сб','Вс']:['Du','Se','Cho','Pa','Ju','Sha','Ya'];document.getElementById('adminSchedules').innerHTML=(r.masters||[]).map(x=>'<div class="schedule-row"><b>'+esc(x.master.name_ru)+'</b>'+Array.from({length:7},(_,d)=>{const q=(x.schedule||[]).find(s=>Number(s.weekday)===d);return '<div style="margin-top:10px"><div class="hint">'+days[d]+'</div><div class="schedule-grid"><input id="sch_'+x.master.key+'_'+d+'_s" value="'+(q?.start||'')+'" placeholder="10:00"><input id="sch_'+x.master.key+'_'+d+'_e" value="'+(q?.end||'')+'" placeholder="20:00"><input id="sch_'+x.master.key+'_'+d+'_ls" value="'+(q?.lunch_start||'')+'" placeholder="Обед с"><input id="sch_'+x.master.key+'_'+d+'_le" value="'+(q?.lunch_end||'')+'" placeholder="Обед до"></div><label class="check"><input type="checkbox" '+(!q?'checked':'')+' id="sch_'+x.master.key+'_'+d+'_off"> Выходной</label><button class="small-btn" onclick="saveSchedule(\''+esc(x.master.key)+'\','+d+')">Сохранить</button></div>'}).join('')+'</div>').join('')}catch(e){toast(tr('error'))}}
async function saveSchedule(k,d){const off=document.getElementById('sch_'+k+'_'+d+'_off').checked;const payload={master_key:k,weekday:d,start:off?'':document.getElementById('sch_'+k+'_'+d+'_s').value,end:off?'':document.getElementById('sch_'+k+'_'+d+'_e').value,lunch_start:off?'':document.getElementById('sch_'+k+'_'+d+'_ls').value,lunch_end:off?'':document.getElementById('sch_'+k+'_'+d+'_le').value};try{await api('/api/admin/schedules',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});toast('Сохранено');loadAdminSchedules()}catch(e){toast(tr('error'))}}
async function loadMasterBookings(){try{const r=await api('/api/master/bookings'),list=r.bookings||[];document.getElementById('masterBookings').innerHTML=list.length?list.map(b=>'<article class="booking" onclick="openBooking('+b.id+',\'master\')"><div class="booking-head"><b>'+esc(b.date)+' · '+esc(b.time)+'</b><span class="status">'+esc(T[state.lang].status[b.status]||b.status)+'</span></div><div class="meta">💇 '+esc(b.service)+'<br>👤 '+esc(b.name)+' · 📞 '+esc(b.phone)+'</div></article>').join(''):'<div class="empty">'+tr('empty')+'</div>'}catch(e){toast(tr('error'))}}
async function loadMasterSummary(){const r=await api('/api/master/bookings');document.getElementById('staffSummary').innerHTML='<div class="staff-card"><b>'+esc(r.master.name_ru)+'</b><div class="meta">'+(r.bookings?.length||0)+' '+(state.lang==='ru'?'активных записей':'faol yozuv')+'</div><button class="primary" onclick="showTab(\'master\')">'+tr('records')+'</button></div>'}
async function loadAdminSummary(){const r=await api('/api/admin/bookings'),n=new Date(),today=String(n.getDate()).padStart(2,'0')+'.'+String(n.getMonth()+1).padStart(2,'0');const c=(r.bookings||[]).filter(b=>b.date===today);document.getElementById('staffSummary').innerHTML='<div class="stats"><div class="stat"><b>'+c.length+'</b><span>Сегодня</span></div><div class="stat"><b>'+c.filter(b=>b.status==='new').length+'</b><span>Новые</span></div><div class="stat"><b>'+c.filter(b=>b.status==='confirmed').length+'</b><span>Подтверждены</span></div></div><button class="primary" onclick="showTab(\'admin\')">Открыть управление</button>'}
async function init(){try{state.me=await api('/api/me');document.getElementById('hello').textContent=state.me.user.first_name||'';document.getElementById('recordsNav').classList.toggle('hidden',!!state.me.is_admin||!!state.me.is_master);document.getElementById('masterNav').classList.toggle('hidden',!state.me.is_master);document.getElementById('adminNav').classList.toggle('hidden',!state.me.is_admin);renderText();await loadCatalog();showTab('home')}catch(e){document.body.innerHTML='<div class="app"><div class="empty" style="margin-top:30vh"><h3>Не удалось открыть приложение</h3><p>'+esc(e.message||'Ошибка')+'</p><button class="primary" onclick="location.reload()">Повторить</button></div></div>'}}init();
</script>
</body>
